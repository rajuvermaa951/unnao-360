server:
  port: ${PORT:8080}

spring: 
  datasource:
    url: jdbc:mysql://${HOST}:${PORT}/${DB_NAME}
    username: root
    password: ${DB_PASSWORD}
    
  jpa: 
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  security:
    user:
      name: ${USERNAME}
      password: ${SECURITY_PASSWORD}
    
jwt: 
  key: ${JWT_KEY}
  expiration: ${JWT_EXPIRATION}
  
  




    
  
